name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests
      - run: swift test
      - run: ./scripts/build-app.sh
      - run: python3 scripts/release.py --tag "v$(plutil -extract version raw -o - version.json)" --validate-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-usage-app-local-build
          path: dist/
          if-no-files-found: error
